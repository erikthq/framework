name: publish

# Runs on every commit to main, and the registry is the decision: each package's
# version is compared against what is published, and only what is missing goes
# up. Nothing else gates it — no path filter, no tag, no manual step — so a
# release is exactly "bump the version and merge", and every other commit is a
# no-op that still runs typecheck and the suite.
#
# That also makes the job idempotent: re-running it publishes nothing, and a run
# that half-failed is fixed by running it again.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Every commit runs this, so pushes queue rather than overlap. Not cancelled in
# flight: a half-finished publish is worse than a slow one.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # What npm exchanges for a signed provenance attestation. Requires a
      # public repository.
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          # Writes the .npmrc that NODE_AUTH_TOKEN below feeds.
          registry-url: https://registry.npmjs.org

      # The deno adapter's suite skips itself when deno is missing, and a skipped
      # test gates nothing. Install it so the gate is real.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # The registry answers an unauthorised write with 404, not 403, so a bad or
      # missing token surfaces as "package not found" *after* the tarball is
      # built and provenance is signed. Fail here instead, where the cause is
      # legible and nothing has been signed yet.
      - name: Check the npm credential
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::The NPM_TOKEN secret is empty or not set on this repository."
            exit 1
          fi

          if ! who=$(npm whoami 2>&1); then
            echo "::error::NPM_TOKEN is not a valid npm credential: $who"
            exit 1
          fi

          echo "authenticated as $who"

          # Publishing a *new* package needs write on the scope itself. A
          # granular token limited to hand-picked packages can update those and
          # nothing else, which is the likeliest reason a first publish 404s.
          if ! npm access list packages @erikt > /dev/null 2>&1; then
            echo "::error::$who cannot read the @erikt scope — the token needs read/write on the scope, not on selected packages."
            exit 1
          fi

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test

      - name: Publish what the registry does not have
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail

          # Dependency order: a consumer resolves the adapters' pinned
          # `@erikt/framework` range, so that one goes up first. Adding a
          # publishable package means adding it here.
          for dir in framework framework-node framework-deno create-framework; do
            manifest="packages/$dir/package.json"
            name=$(node -p "require('./$manifest').name")
            version=$(node -p "require('./$manifest').version")

            # Empty for a version that is not on the registry, and for a package
            # that does not exist at all — both mean "publish it".
            if [ -n "$(npm view "$name@$version" version 2>/dev/null || true)" ]; then
              echo "· $name@$version is already published"
              continue
            fi

            echo "→ publishing $name@$version"

            # Packed by pnpm, uploaded by npm, and it has to be that way round:
            # only pnpm rewrites `workspace:*` to a real version, and only npm
            # can attach provenance. The tarball carries pnpm's rewrites and its
            # own publishConfig, so npm honours the public access from it.
            # `pnpm pack` prints the tarball path as its last line, and does
            # no git checks — only `pnpm publish` does, which is one reason not
            # to use it here.
            tarball=$(cd "packages/$dir" && pnpm pack --pack-destination "$RUNNER_TEMP" | tail -1)

            npm publish "$tarball" --provenance
          done
